<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hossam Ahmed (Dexter) — Full-Stack Developer, Co-founder of 7stacks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2833" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.7"/>
  <circle cx="1010" cy="70" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- stack glyph -->
  <g transform="translate(70 92)">
    <rect x="0" y="0"  width="64" height="14" rx="4" fill="url(#accent)"/>
    <rect x="0" y="22" width="64" height="14" rx="4" fill="#f5b942" opacity="0.7"/>
    <rect x="0" y="44" width="64" height="14" rx="4" fill="#f5b942" opacity="0.4"/>
    <rect x="0" y="66" width="64" height="14" rx="4" fill="#f5b942" opacity="0.2"/>
  </g>

  <!-- English side -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="160" y="118" fill="#e8edf2" font-size="46" font-weight="700">Hossam Ahmed</text>
    <text x="160" y="152" fill="#8a96a3" font-size="20" font-family="'JetBrains Mono', Consolas, monospace">@Dex11x2 · aka Dexter</text>
    <text x="160" y="196" fill="url(#accent)" font-size="24" font-weight="600">Full-Stack Developer · Co-founder @ 7stacks</text>
    <text x="160" y="228" fill="#8a96a3" font-size="18">Production platforms for the Arab market — commerce, ERP, EdTech, games</text>
  </g>

  <!-- Arabic side -->
  <g font-family="'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" direction="rtl" text-anchor="start">
    <text x="1130" y="118" fill="#e8edf2" font-size="40" font-weight="700">حسام أحمد</text>
    <text x="1130" y="156" fill="#f5b942" font-size="21">مطوّر ويب متكامل</text>
    <text x="1130" y="186" fill="#8a96a3" font-size="18">شريك مؤسس في استوديو 7stacks</text>
  </g>

  <!-- footer strip -->
  <line x1="70" y1="266" x2="1130" y2="266" stroke="#1f2833" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#6b7785">
    <text x="70" y="294">Alexandria, Egypt 🇪🇬</text>
    <text x="1130" y="294" text-anchor="end">Arabic-first · RTL · Paymob / Tabby / Tamara</text>
  </g>
</svg>
